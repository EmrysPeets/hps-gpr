sigma_tail_m0_2016: 0.18
sigma_tail_slope_floor_2016: 0.0
sigma_tail_slope_override_2016: 0.0239
sigma_coeffs_2021: [0.00184825, -0.001375, 0.085875]

frad_coeffs_2015: [0.085]
frad_coeffs_2016: [0.05]
frad_coeffs_2021: [0.05]
radiative_penalty_on: true
radiative_penalty_frac_2015: 0.07
radiative_penalty_frac_2016: 0.07
radiative_penalty_frac_2021: 0.046

enable_2015: true
enable_2016: true
enable_2021: true

kernel_constant_init: 1.0
kernel_constant_bounds: [1.0e-08, 1.0e+18]
kernel_ls_init: 0.03
kernel_ls_bounds: [0.001, 0.5]
kernel_ls_policy: resolution_scaled_local
kernel_ls_res_lower_factor: 1.0
kernel_ls_res_upper_factor: 8.0
kernel_ls_res_stat: median
kernel_ls_res_npts: 300
kernel_ls_res_lower_factor_by_dataset:
  '2015': 1.0
  '2016': 0.9
  '2021': 1.1
kernel_ls_res_upper_factor_by_dataset:
  '2015': 8.0
  '2016': 8.0
  '2021': 15.0
kernel_ls_bounds_by_dataset: {}
kernel_ls_init_by_dataset: {}
kernel_ls_local_hi_floor_mode: dataset_stat
kernel_ls_local_hi_floor_factor: 0.8

pre_log: true
pre_zero_alpha: 1.0
alpha_model: 1/y
pre_alpha_first_n: 0
pre_alpha_first_factor: 0.1

mass_step_gev: 0.001
blind_nsigma: 2.25
gp_train_exclude_nsigma: 2.25
neighborhood_rebin: 5
n_restarts: 12
scan_parallel: true
scan_n_workers: 3
scan_parallel_backend: threading
scan_threads_per_worker: 1
toy_scan_parallel: false
toy_scan_n_workers: 1
toy_scan_parallel_backend: threading
toy_scan_threads_per_worker: 1
scan_diagnostic_plot_every_n: 5
scan_diagnostic_zoom_half_sigma: 0.5
scan_require_two_sidebands: false
scan_edge_guard_nsigma: 2.25

cls_alpha: 0.1
cls_mode: asymptotic
cls_num_toys: 0
cls_seed_base: 12345

# `make_ul_bands` is the outer gate for the combined-band implementation.
# The empty individual selection below prevents any 2015/2016/2021-only band.
make_ul_bands: true
ul_bands_toys: 0
ul_bands_seed: 12345
ul_bands_n_workers: 3
ul_bands_parallel_backend: threading
ul_bands_threads_per_worker: 1
ul_bands_refit_gp_on_toy: false
ul_bands_refit_gp_restarts: 0
ul_bands_refit_gp_optimize: true
ul_bands_train_exclude_nsigma: 2.25
ul_bands_cls_mode: asymptotic
do_combined_bands: true
combined_bands_n_toys: 100
combined_bands_seed: 24680

data_visibility:
  '2015': observed
  '2016': observed
  '2021': observed

inject_signal: false
extract_allow_negative: true
do_combined: true
combined_mode: count_scale
eps2_lrt_scale: 1.0e10
run_limit_bands_on: ''
make_eps2_bands: false

output_dir: /Users/emryspeets/Desktop/gp_mods/hps-gpr-emrys-validation_workflow/study_results/finalist_k15_2021_10pct_combined100toy_20260803/combined/raw_scan_and_bands
