# Final combined-campaign card frozen on 2026-08-03.
#
# Inputs: 2015 100%, 2016 100%, and 2021 10%.
# The simultaneous overlap uses the shared-epsilon^2 count-scale likelihood.
# Only the 2021 GP support/bound changes relative to nominal analysis-note-v3:
# fit/training support 40--300 MeV and upper RBF factor 15.
# Individual-year expected bands are suppressed. The stitched combined-campaign
# band uses exactly 100 conditional pseudoexperiments per mass, with no GP
# refit on each toy and a fixed seed.

path_2015: /Users/emryspeets/research_plots/2015_data/invariant_mass_0pt5mm_full.root
path_2016: /Users/emryspeets/root_files/EventSelection_pass4Full.root
path_2021: /Users/emryspeets/Desktop/gp_mods/10pct_2021/final_10pct_invM.root
path_2021_mc: ''
only_2021_mc: false

hist_2015: invariant_mass
hist_2016: h_Minv_General_Final_1
hist_2021: preselection/h_invM_8000

range_2015: [0.019, 0.090]
range_2016: [0.039, 0.180]
range_2021: [0.050, 0.250]
data_range_2015: [0.019, 0.090]
data_range_2016: [0.039, 0.180]
data_range_2021: [0.040, 0.300]

sigma_coeffs_2015: [-9.22283032152e-05, 0.0532190838657]
